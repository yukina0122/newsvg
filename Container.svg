<?xml version="1.0" encoding="UTF-8"?>
<!--
  SVGMap.js ルートコンテナファイル
  参考: https://github.com/svgmap/svgMapTools/blob/master/tutorials/tutorial1.md
  https://www.svgmap.org/wiki/index.php?title=チュートリアル2a

  viewBox の単位はメートル相当。globalCoordinateSystem の matrix で
  緯度経度 -> ローカル座標へのスケールを定義している。
  ここでは x = 100000 * longitude, y = -100000 * latitude としている
  (チュートリアル2aと同じ考え方、係数だけ都市スケール用に調整)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:go="http://purl.org/svgmap/profile"
     viewBox="-5000 -5000 10000 10000">

  <globalCoordinateSystem srsName="http://purl.org/crs/84"
                           transform="matrix(100000,0,0,-100000,0,0)" />

  <!-- Thematic Layer -->
  <animation title="Nearby Pins (OSM)"
             xlink:href="pinsLayer.svg"
             class="poi"
             x="-5000" y="-5000" width="10000" height="10000" />

</svg>
