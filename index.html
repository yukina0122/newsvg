<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1.0">
  <title>AR Map Pins</title>
  <link rel="stylesheet" href="style.css">

  <!-- SVGMap.js コアAPIの読み込み (公式デモと同じ構成) -->
  <script type="text/javascript" src="https://unpkg.com/jsts@1.6.1/dist/jsts.min.js"></script>
  <script type="module">
    import { svgMap } from 'https://cdn.jsdelivr.net/gh/svgmap/svgmapjs@latest/SVGMapLv0.1_r18module.js';
    window.svgMap = svgMap;
  </script>
</head>

<body style="overflow:hidden;margin:0;">
  <video id="camera" autoplay playsinline></video>

  <!-- SVGMap.js はここに Container.svg を読み込んで地図を描画する -->
  <div id="mapcanvas" data-src="Container.svg"></div>

  <!--
    以下は SVGMap.js が内部で document.getElementById() を呼ぶために
    「存在しないと初期化時に例外で落ちる」要素群。
    公式デモ(svgmap/svgMapDemo の index.html)の構造をそのまま踏襲している。
    表示上は不要なものは style="display:none" ではなく
    visibility/position で隠す(display:noneだとparentNode取得後の
    レイアウト計算に影響する場合があるため、SVGMap.js側の挙動が
    未確認なうちは opacity+pointer-events で隠すのが安全)
  -->
  <div id="gui">
    <img id="zoomupButton" class="map-ctrl-btn" style="left:5px;top:5px;position:absolute;" src="https://svgmap.org/demos/demo1/imgs/zoomup.png" onclick="svgMap.zoomup()" width="28" height="28" />
    <img id="zoomdownButton" class="map-ctrl-btn" style="left:5px;top:38px;position:absolute;" src="https://svgmap.org/demos/demo1/imgs/zoomdown.png" onclick="svgMap.zoomdown()" width="28" height="28" />
    <img id="gpsButton" class="map-ctrl-btn" style="left:5px;top:71px;position:absolute;" src="https://svgmap.org/demos/demo1/imgs/gps.png" onclick="svgMap.gps()" width="28" height="28" />

    <!-- centerSight: これが無いと SVGMap.js の MapTicker 初期化が例外で落ちる -->
    <img id="centerSight" style="opacity:0.5;left:50%;top:50%;position:absolute;pointer-events:none;" src="https://svgmap.org/demos/demo1/imgs/Xcursor.png" width="15" height="15"/>

    <table style="right:3px;top:3px;position:absolute;font-size:11px;color:#fff;background:rgba(0,0,0,.4);pointer-events:none;">
      <tr><td>Lat,Lng:</td><td id="centerPos"></td></tr>
    </table>

    <img id="vscaleImg" style="left:5px;bottom:42px;position:absolute;" src="https://svgmap.org/demos/demo1/imgs/vscale.png" />
    <font id="vScale" size="-2" color="#fff" style="left:5px;bottom:28px;position:absolute;">xxx Km</font>
    <span id="globalMessage" style="font-size:10px;left:80px;bottom:28px;position:absolute;color:#fff;"></span>

    <!-- レイヤー管理UI。今回は使わないが要素自体は必要なため画面外に置いて隠す -->
    <div id="layerList" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;"></div>
    <div id="layerSpecificUI" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;">
      <div id="layerSpecificUIbody"></div>
    </div>
  </div>

  <div id="hud">
    <h2>AR Map Pins</h2>

    <button id="cameraBtn">カメラ開始</button>
    <button id="addPin">周辺ピンを表示</button>

    <div id="status">準備完了</div>
    <div id="pins"></div>

    <small>
      © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">
        OpenStreetMap contributors
      </a>
      ／ Map rendering by
      <a href="https://svgmap.org/" target="_blank" rel="noopener">SVGMap.js</a>
    </small>
  </div>

  <script src="js/camera.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
